name: Build & Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "claude-terminal/**"
      - ".github/workflows/build-test.yml"

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: claude-terminal/Dockerfile
          failure-threshold: error
          # HA add-ons use BUILD_FROM arg for base image and Alpine rolling packages
          ignore: DL3006,DL3018

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            build_from: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            build_from: ghcr.io/home-assistant/aarch64-base:3.21
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ./claude-terminal
          push: false
          # --load only works for native arch; cross-arch just verifies build succeeds
          load: ${{ matrix.arch == 'amd64' }}
          platforms: ${{ matrix.arch == 'amd64' && 'linux/amd64' || 'linux/arm64' }}
          tags: test/claude-terminal:${{ matrix.arch }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}

      - name: Smoke test — image is runnable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c "echo 'Image runs OK'"

      - name: Smoke test — scripts are executable
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c '
              for script in \
                /run.sh \
                /opt/scripts/setup-ha-mcp.sh \
                /opt/scripts/health-check.sh \
                /opt/scripts/persist-install.sh \
                /opt/scripts/ha-context.sh \
                /opt/scripts/welcome.sh; do
                if [ ! -x "$script" ]; then
                  echo "FAIL: $script is not executable"
                  exit 1
                fi
                echo "OK: $script"
              done
            '

      - name: Smoke test — add-on boots and serves the terminal
        if: matrix.arch == 'amd64'
        # Runs the real entrypoint with no Supervisor. bashio in this base
        # image fetches options from the Supervisor API (not /data/options.json),
        # so every bashio::config call logs its own "Failed to get addon config
        # from Supervisor API" ERROR and returns empty; run.sh's defaults then
        # apply (shell mode, no auto-update). Those bashio lines are filtered
        # out below; any other ERROR is ours. What this proves: nothing on the
        # boot path blocks or dies without a Supervisor, the terminal answers
        # through nginx within 60s, ttyd itself (7682) is loopback-only, and
        # the ingress gate (#146) is right in both modes:
        #   open   — no SUPERVISOR_TOKEN (local runs): the runner gets a 200
        #   closed — a token but no reachable Supervisor, so the published-port
        #            lookup fails: the runner is not 172.30.32.2 and must get
        #            a 403. This is the fail-closed path a real add-on takes.
        run: |
          boot_test() {
            local mode=$1 expect_outside=$2; shift 2
            docker run -d --name boot-test -p 7681:7681 "$@" \
              -v "$(mktemp -d):/data" -v "$(mktemp -d):/config" \
              test/claude-terminal:amd64 >/dev/null

            local ok=0
            for _ in $(seq 1 30); do
              if docker exec boot-test curl -fsS -o /dev/null http://127.0.0.1:7681/; then ok=1; break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' boot-test)" != "true" ]; then break; fi
              sleep 2
            done

            local ip outside ttyd_direct
            ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' boot-test)
            outside=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:7681/ || true)
            ttyd_direct=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://${ip}:7682/" || true)

            echo "--- add-on log (${mode}) ---"
            docker logs boot-test 2>&1 | tee /tmp/boot.log
            echo "------------------"

            docker rm -f boot-test >/dev/null
            if [ "$ok" != 1 ]; then
              echo "FAIL (${mode}): web terminal did not answer on port 7681 within 60s"
              exit 1
            fi
            if [ "$outside" != "$expect_outside" ]; then
              echo "FAIL (${mode}): a non-ingress client got HTTP ${outside} on 7681, expected ${expect_outside}"
              exit 1
            fi
            if [ "$ttyd_direct" != 000 ]; then
              echo "FAIL (${mode}): ttyd answered on ${ip}:7682 (HTTP ${ttyd_direct}); it must listen on loopback only"
              exit 1
            fi
            if grep 'ERROR' /tmp/boot.log \
                | grep -v -e 'Supervisor API' -e 'Something went wrong contacting the API' \
                | grep -q .; then
              echo "FAIL (${mode}): startup logged an ERROR (other than bashio's expected Supervisor-API errors)"
              exit 1
            fi
            if ! grep -q 'Starting web terminal' /tmp/boot.log; then
              echo "FAIL (${mode}): run.sh never reached start_web_terminal"
              exit 1
            fi
            echo "OK (${mode}): booted, serves the terminal, outside client got ${outside}"
          }

          boot_test open 200
          boot_test closed 403 -e SUPERVISOR_TOKEN=ci-no-supervisor

      - name: Smoke test — key binaries available
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --entrypoint /bin/bash \
            test/claude-terminal:amd64 -c '
              for bin in node npm claude git tmux ttyd nginx jq curl uv; do
                if ! which "$bin" > /dev/null 2>&1; then
                  echo "FAIL: $bin not found"
                  exit 1
                fi
                echo "OK: $bin"
              done
            '
