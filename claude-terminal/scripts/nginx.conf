# nginx in front of ttyd — the only listener on the add-on's network
# interface (#146).
#
# ttyd has no client allowlist, and every add-on shares the hassio Docker
# network, so a ttyd bound to 0.0.0.0 hands a root shell (Supervisor manager
# role, HA admin token, the user's Claude/GitHub credentials) to any other
# add-on that connects. Ingress traffic always arrives from the Supervisor at
# 172.30.32.2, so that is the only remote peer accepted here; ttyd itself
# listens on loopback only. IPv4 only on purpose: an IPv6 listener would be a
# second door for the allowlist to cover.

worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 7681;

        allow 172.30.32.2;
        allow 127.0.0.1;
        # Local development only: run.sh writes `allow all;` here when the
        # container is started with DEV_ALLOW_ANY_CLIENT=1. The glob makes the
        # include a no-op when the file is absent, which it is in a real add-on.
        include /run/claude-terminal/allow-any-client.con[f];
        deny all;

        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            # ttyd pings every 30s, but a long idle tab must never be cut
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
